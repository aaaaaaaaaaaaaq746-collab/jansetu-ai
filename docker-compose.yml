services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  api:
    build: ./backend
    environment:
      MONGODB_URI: mongodb://mongo:27017/jansetu_ai
      PORT: 5000
      CLIENT_URL: http://localhost:4173
    depends_on: [mongo]
    ports: ["5000:5000"]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["4173:80"]
volumes:
  mongo_data:
